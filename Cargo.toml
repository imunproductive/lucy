[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "MIT"

[workspace.dependencies]
orpheus-core = { path = "crates/core" }
orpheus-assets = { path = "crates/assets" }
orpheus-casc = { path = "crates/casc" }
orpheus-fixed = { path = "crates/fixed" }
orpheus-stu = { path = "crates/stu" }
orpheus-wire = { path = "crates/wire" }
orpheus-content = { path = "crates/content" }
orpheus-bnet = { path = "crates/bnet" }
orpheus-physics = { path = "crates/physics" }
orpheus-script = { path = "crates/script" }
orpheus-sim = { path = "crates/sim" }
orpheus-lobby = { path = "crates/lobby" }
orpheus-server = { path = "crates/server" }
orpheus-launcher = { path = "crates/launcher" }
orpheus-testkit = { path = "crates/testkit" }
aes = "0.8"
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
crc32fast = "1"
ctrlc = "3.5.2"
directories = "6.0.0"
flate2 = "1.1"
getrandom = "0.3"
hmac = "0.12"
indexmap = { version = "2", features = ["serde"] }
md-5 = "0.10"
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz"] }
# Byte-identical XZ to Python's `lzma` (liblzma) for the collision caches.
liblzma = { version = "0.4", default-features = false, features = ["static"] }
mio = { version = "1.1.1", features = ["net", "os-poll"] }
prost = "0.14"
prost-reflect = "0.16"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
tiny_http = "0.12.0"
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
windows-sys = "0.61.2"

# Deriving the game data from the install in a debug build (the first server
# start, the game-tier tests) would take far longer without optimization.
[profile.dev.package.orpheus-assets]
opt-level = 3

[profile.dev.package.orpheus-casc]
opt-level = 3

[profile.dev.package.orpheus-stu]
opt-level = 3

# A debug server runs every body's statescript, mover and replication each
# tick: unoptimized, a Practice vs AI match's twelve bodies take about as
# long as the ticks they simulate, and a server that falls behind leaves
# the AI heroes standing (their commands come far apart, and a body holds
# an input for 32 frames only). Some optimization keeps the debug server
# and its game-tier tests at real time; debug assertions stay on.
[profile.dev.package.orpheus-script]
opt-level = 1

[profile.dev.package.orpheus-physics]
opt-level = 1

[profile.dev.package.orpheus-sim]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# The game-install tests (`just test-game`, `just test-slow`, `just test-named … gametest`)
# run whole matches and hero graphs, which a debug build runs two to three times
# slower. This profile optimises every crate (opt-level 3, from release) but
# keeps the debug assertions, so the VM still refuses statescript content it
# does not implement, as in `cargo test` (`vm::Unknowns::for_build`), and the
# overflow checks. It inherits release, not dev, so the `profile.dev.package`
# levels above don't apply to it. Many codegen units and incremental builds
# keep the rebuild after a change short.
[profile.gametest]
inherits = "release"
debug-assertions = true
overflow-checks = true
codegen-units = 256
incremental = true
debug = "line-tables-only"
