# Debug builds and tests compile with Cranelift (`profile.dev` below), which needs
# the nightly toolchain that rust-toolchain.toml pins.
cargo-features = ["codegen-backend"]

[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "MIT"

[workspace.dependencies]
lucy-core = { path = "crates/core" }
lucy-simd = { path = "crates/simd" }
lucy-assets = { path = "crates/assets" }
lucy-casc = { path = "crates/casc" }
lucy-fixed = { path = "crates/fixed" }
lucy-stu = { path = "crates/stu" }
lucy-wire = { path = "crates/wire" }
lucy-content = { path = "crates/content" }
lucy-bnet = { path = "crates/bnet" }
lucy-physics = { path = "crates/physics" }
lucy-script = { path = "crates/script" }
lucy-sim = { path = "crates/sim" }
lucy-lobby = { path = "crates/lobby" }
lucy-server = { path = "crates/server" }
lucy-launcher = { path = "crates/launcher" }
lucy-testkit = { path = "crates/testkit" }
lucy-workshop = { path = "crates/workshop" }
aes = "0.8"
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
base64 = "0.22"
clap = { version = "4.6.7", features = ["derive", "env"] }
crc32fast = "1"
ctrlc = "3.5.2"
directories = "6.0.0"
flate2 = "1.1"
getrandom = "0.3"
hmac = "0.12"
indexmap = { version = "2", features = ["serde"] }
md-5 = "0.10"
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz"] }
mimalloc = "0.1.52"
mio = { version = "1.1.1", features = ["net", "os-poll"] }
prost = "0.14"
prost-reflect = "0.16"
roxmltree = "0.20"
ruzstd = { version = "0.8", default-features = false, features = ["std"] }
safe_arch = { version = "0.7.4", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
windows-sys = "0.61.2"

# Debug builds and tests (dev, and test, which inherits it) use Cranelift: after a
# change to lucy-script a test build took 314 s with LLVM and 35 s with Cranelift
# (2026-11-20, docs/dev/testing.md "Build speed"). Its code runs about 1.5 times
# slower than LLVM's. Release and gametest (which inherits release) keep LLVM.
# Cranelift can't unwind on Windows, so a debug build aborts on a panic, and each
# test runs in its own process (`panic-abort-tests`, .cargo/config.toml).
[profile.dev]
codegen-backend = "cranelift"

# Deriving the game data from the install in a debug build (the first server
# start, the game-tier tests) would take far longer without optimization, so
# these three keep LLVM at full optimization.
[profile.dev.package.lucy-assets]
opt-level = 3
codegen-backend = "llvm"

[profile.dev.package.lucy-casc]
opt-level = 3
codegen-backend = "llvm"

[profile.dev.package.lucy-stu]
opt-level = 3
codegen-backend = "llvm"

# This one out-of-line estimate uses an SSE intrinsic Cranelift cannot lower.
# Keep physics on Cranelift; only its small hardware bridge uses LLVM.
[profile.dev.package.lucy-simd]
opt-level = 3
codegen-backend = "llvm"

# A debug server runs every body's statescript, mover and replication each
# tick: unoptimized, a Practice vs AI match's twelve bodies take about as
# long as the ticks they simulate, and a server that falls behind leaves
# the AI heroes standing (their commands come far apart, and a body holds
# an input for 32 frames only). Some optimization keeps the debug server
# and its game-tier tests at real time; debug assertions stay on. These three
# are the most edited crates, so they use Cranelift, whose code is slower; play
# and the long test runs use release or gametest.
[profile.dev.package.lucy-script]
opt-level = 1

[profile.dev.package.lucy-physics]
opt-level = 1

[profile.dev.package.lucy-sim]
opt-level = 1

# Dependencies are built once per target folder: LLVM at full optimization.
[profile.dev.package."*"]
opt-level = 3
codegen-backend = "llvm"

# The relay and probe DLLs run inside the game and catch panics at their hooks
# (`catch_unwind`), which needs unwinding: LLVM.
[profile.dev.package.lucy-relay]
codegen-backend = "llvm"

[profile.dev.package.lucy-probe]
codegen-backend = "llvm"

# The game-install tests (`just test-game`, `just test-slow`, `just test-named … gametest`)
# run whole matches and hero graphs, which a debug build runs two to three times
# slower. This profile optimises every crate (opt-level 3, from release) but
# keeps the debug assertions, so the VM still refuses statescript content it
# does not implement, as in `cargo test` (`vm::Unknowns::for_build`), and the
# overflow checks. It inherits release, not dev, so the `profile.dev.package`
# levels above don't apply to it. Many codegen units and incremental builds
# keep the rebuild after a change short.
[profile.gametest]
inherits = "release"
debug-assertions = true
overflow-checks = true
codegen-units = 256
incremental = true
debug = "line-tables-only"

# The load harness (`just load`) and the profiler measure the release build's
# code: this profile is release with line tables, so a sampling profiler can
# name the functions (`tools/sample_threads.py`).
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
