[package]
name = "orpheus-physics"
description = "Collision, character movement and AI navigation for retail build 104319"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
flate2.workspace = true
indexmap.workspace = true
lzma-rust2.workspace = true
orpheus-core.workspace = true
orpheus-wire.workspace = true
serde.workspace = true
serde_json.workspace = true

[features]
# Test builders shared with the tests of dependent crates.
fixtures = []

[dev-dependencies]
# The integration tests use the fixture defaults (`MoverSettings::default`).
orpheus-physics = { path = ".", features = ["fixtures"] }
orpheus-testkit.workspace = true
sha2.workspace = true
tempfile.workspace = true
