[package]
name = "lucy-assets"
description = "Derives the server's game data from the local 1.74 install"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
lucy-casc.workspace = true
lucy-fixed.workspace = true
lucy-stu.workspace = true
flate2.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }

[dev-dependencies]
lucy-physics = { workspace = true, features = ["fixtures"] }
lucy-stu.workspace = true
lucy-testkit.workspace = true
lucy-wire.workspace = true
