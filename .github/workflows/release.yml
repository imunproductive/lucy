# A release for a pushed tag v1.2.3 (docs/dev/releasing.md): `tools/dist/dist.py` builds
# lucy.exe and owwfd_relay.dll with the tag's version and zips them with the user guide; this
# publishes the zip, its SHA-256 and the release notes as the tag's GitHub Release.
# Run by hand (Actions > Release > Run workflow) it is a dry run: it builds and packages a
# version you give and uploads the files as a workflow artifact, with no release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version for the dry run (no release is published)
        required: true
        default: 0.0.0-dryrun

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v5
        with:
          # The release notes list the commits since the previous v* tag.
          fetch-depth: 0

      # actions/checkout stores the pushed tag without its annotation, which the release notes use.
      - name: Fetch the tags as they are
        run: git fetch --force --tags origin

      # The nightly that rust-toolchain.toml pins (Cargo.toml's `cargo-features` needs nightly).
      # The release profile compiles with LLVM; Cranelift is only for debug builds.
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustc --version

      # The cargo registry and the compiled dependencies. A tag's run restores the caches of the
      # default branch (a dry run there saves one) and, on a rerun, its own.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release

      - name: Build and package
        id: dist
        env:
          VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: |
          python tools/dist/dist.py $env:VERSION
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-Content dist/SHA256SUMS.txt

      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.dist.outputs.tag }}
          VERSION: ${{ steps.dist.outputs.version }}
          ZIP: ${{ steps.dist.outputs.zip }}
          PRERELEASE: ${{ steps.dist.outputs.prerelease }}
        run: |
          $flags = @()
          if ($env:PRERELEASE -eq 'true') { $flags += '--prerelease' }
          gh release create $env:TAG $env:ZIP dist/SHA256SUMS.txt --verify-tag --title "Lucy $env:VERSION" --notes-file dist/release-notes.md @flags
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Keep the dry run's files
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: lucy-${{ steps.dist.outputs.version }}
          path: |
            ${{ steps.dist.outputs.zip }}
            dist/SHA256SUMS.txt
            dist/release-notes.md
